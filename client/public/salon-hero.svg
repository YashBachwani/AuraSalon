<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="400" y1="0" x2="400" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24211D"/>
      <stop offset="40%" stop-color="#1A1816"/>
      <stop offset="100%" stop-color="#100F0E"/>
    </linearGradient>

    <!-- Warm Golden Ambient Glow -->
    <radialGradient id="ambientGlow" cx="400" cy="420" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C89B45" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#9B7650" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1A1816" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldLinear" x1="200" y1="200" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5EFE4"/>
      <stop offset="35%" stop-color="#E8C982"/>
      <stop offset="70%" stop-color="#C89B45"/>
      <stop offset="100%" stop-color="#9B7650"/>
    </linearGradient>

    <linearGradient id="chairLeather" x1="300" y1="300" x2="500" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34302B"/>
      <stop offset="50%" stop-color="#24211D"/>
      <stop offset="100%" stop-color="#171513"/>
    </linearGradient>

    <linearGradient id="chromeMetal" x1="350" y1="500" x2="450" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="40%" stop-color="#9CA3AF"/>
      <stop offset="70%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>

    <!-- Floor Reflection Gradient -->
    <linearGradient id="floorGrad" x1="400" y1="720" x2="400" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="25%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#0B0B0A"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Studio Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>

  <!-- Architectural Background Arch & Panels -->
  <path d="M 220 720 V 320 A 180 180 0 0 1 580 320 V 720" stroke="#C89B45" stroke-opacity="0.18" stroke-width="2" fill="none"/>
  <path d="M 250 720 V 340 A 150 150 0 0 1 550 340 V 720" stroke="#C89B45" stroke-opacity="0.08" stroke-width="1.5" fill="none"/>
  <path d="M 160 720 V 260 A 240 240 0 0 1 640 260 V 720" stroke="#C89B45" stroke-opacity="0.10" stroke-width="1" fill="none"/>

  <!-- Vertical Decorative Molding Lines -->
  <line x1="80" y1="60" x2="80" y2="720" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="720" y1="60" x2="720" y2="720" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Ambient Light Sphere -->
  <circle cx="400" cy="420" r="380" fill="url(#ambientGlow)"/>

  <!-- Warm Halo Behind Chair Headrest -->
  <circle cx="400" cy="330" r="110" fill="#C89B45" fill-opacity="0.18" filter="url(#softGlow)"/>

  <!-- Floor Surface & Perspective Line -->
  <rect x="0" y="720" width="800" height="280" fill="url(#floorGrad)"/>
  <line x1="0" y1="720" x2="800" y2="720" stroke="#C89B45" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Master Barbering Chair (Artisanal Vector Composition) -->
  <g id="master-barber-chair">
    <!-- Cast Shadow on Floor -->
    <ellipse cx="400" cy="745" rx="190" ry="26" fill="#050504" fill-opacity="0.75" filter="url(#softGlow)"/>

    <!-- Hydraulic Chrome Base -->
    <ellipse cx="400" cy="735" rx="145" ry="18" fill="url(#chromeMetal)"/>
    <ellipse cx="400" cy="732" rx="140" ry="15" fill="#1C1A17"/>
    <ellipse cx="400" cy="730" rx="136" ry="13" fill="url(#chromeMetal)" fill-opacity="0.6"/>

    <!-- Hydraulic Column Shaft -->
    <rect x="382" y="605" width="36" height="125" rx="4" fill="url(#chromeMetal)"/>
    <!-- Gold Trim Ring on Shaft -->
    <rect x="380" y="635" width="40" height="10" rx="2" fill="url(#goldLinear)"/>

    <!-- Heavy Metal Footrest Assembly -->
    <path d="M 330 675 L 360 625 H 440 L 470 675 Z" fill="url(#chromeMetal)" fill-opacity="0.4"/>
    <rect x="320" y="670" width="160" height="12" rx="4" fill="url(#chairLeather)"/>
    <rect x="325" y="672" width="150" height="8" rx="3" stroke="url(#goldLinear)" stroke-width="1" fill="none"/>

    <!-- Chair Seat Cushion (Plush Quilted Charcoal Leather) -->
    <rect x="290" y="545" width="220" height="65" rx="18" fill="url(#chairLeather)"/>
    <rect x="294" y="549" width="212" height="57" rx="14" stroke="#C89B45" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>
    <!-- Leather Seams -->
    <line x1="364" y1="550" x2="364" y2="605" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
    <line x1="436" y1="550" x2="436" y2="605" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- Polished Chrome Armrests -->
    <!-- Left Armrest -->
    <path d="M 265 520 C 265 470 285 450 310 450 H 325 V 550 H 295 C 275 550 265 540 265 520 Z" fill="url(#chromeMetal)"/>
    <rect x="280" y="445" width="42" height="16" rx="6" fill="url(#chairLeather)"/>
    <rect x="282" y="447" width="38" height="12" rx="4" stroke="url(#goldLinear)" stroke-width="1" fill="none"/>

    <!-- Right Armrest -->
    <path d="M 535 520 C 535 470 515 450 490 450 H 475 V 550 H 505 C 525 550 535 540 535 520 Z" fill="url(#chromeMetal)"/>
    <rect x="478" y="445" width="42" height="16" rx="6" fill="url(#chairLeather)"/>
    <rect x="480" y="447" width="38" height="12" rx="4" stroke="url(#goldLinear)" stroke-width="1" fill="none"/>

    <!-- Chair Backrest Cushion -->
    <path d="M 320 540 L 310 370 C 310 340 330 325 360 325 H 440 C 470 325 490 340 490 370 L 480 540 Z" fill="url(#chairLeather)"/>
    <path d="M 324 534 L 316 372 C 316 346 333 333 360 333 H 440 C 467 333 484 346 484 372 L 476 534 Z" stroke="#C89B45" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>

    <!-- Quilted Diamond Stitch Pattern on Backrest -->
    <path d="M 350 420 L 400 370 L 450 420 L 400 470 Z" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" fill="none"/>
    <path d="M 350 490 L 400 440 L 450 490 L 400 540 Z" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" fill="none"/>

    <!-- Ergonomic Headrest Assembly -->
    <rect x="390" y="275" width="20" height="52" fill="url(#chromeMetal)"/>
    <rect x="345" y="245" width="110" height="42" rx="12" fill="url(#chairLeather)"/>
    <rect x="349" y="249" width="102" height="34" rx="8" stroke="url(#goldLinear)" stroke-width="1.5" fill="none"/>

    <!-- Recline Lever with Gold Ball Finial -->
    <line x1="510" y1="575" x2="540" y2="615" stroke="url(#chromeMetal)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="543" cy="620" r="9" fill="url(#goldLinear)"/>
  </g>

  <!-- Elegant Ambient Barber Shears (Gold Accent Watermark Left) -->
  <g transform="translate(140, 180) rotate(-28)" opacity="0.45">
    <path d="M 0 0 C 20 -20 50 -10 60 20 L 150 140 L 140 150 L 50 40 C 30 50 10 30 0 0 Z" fill="url(#goldLinear)"/>
    <circle cx="20" cy="10" r="14" stroke="url(#goldLinear)" stroke-width="3" fill="none"/>
    <path d="M 40 -15 C 50 10 30 35 10 45 L 140 160 L 150 150 L 55 20 C 60 5 50 -10 40 -15 Z" fill="url(#goldLinear)"/>
    <circle cx="25" cy="35" r="14" stroke="url(#goldLinear)" stroke-width="3" fill="none"/>
    <!-- Pivot Screw -->
    <circle cx="55" cy="32" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Subtle Overhead Luxury Chandelier / Warm Glow Spotlights -->
  <circle cx="400" cy="20" r="180" fill="#E8C982" fill-opacity="0.12" filter="url(#softGlow)"/>

  <!-- Salon Brand Seal Header / Watermark -->
  <g transform="translate(400, 110)">
    <circle cx="0" cy="0" r="32" stroke="#C89B45" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="28" stroke="#C89B45" stroke-opacity="0.2" stroke-width="1" fill="none"/>
    <!-- Stylized Crown / A Monogram -->
    <path d="M -12 8 L 0 -12 L 12 8 M -8 2 H 8" stroke="url(#goldLinear)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="55" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="700" letter-spacing="6" fill="#F5EFE4" fill-opacity="0.9">AURA SALON</text>
    <text x="0" y="73" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="600" letter-spacing="4" fill="#C89B45" fill-opacity="0.85">MASTER GROOMING LOUNGE</text>
  </g>
</svg>
